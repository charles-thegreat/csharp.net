# Local SQL Server for development. Password comes from .env (gitignored); see .env.example.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kaizen-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - kaizen-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  kaizen-sqldata:
